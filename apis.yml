aid: vev
name: Vev
description: >-
  Vev is a no-code web design and publishing platform for enterprise teams,
  letting designers and marketers build interactive content, landing pages, and
  high-performing marketing materials in a visual Design Editor (trusted by
  brands like Experian and Pfizer). Its developer surface extends the platform
  with code: a REST API at api.vev.design authenticated with an x-vev-key API
  key, a publish webhook that delivers server-rendered HTML/CSS/JS to your own
  host on every publish, a React component SDK (@vev/react + registerVevComponent)
  for building custom drag-and-drop widgets, a CLI (@vev/cli) for local
  development and deployment, and CMS integration via client-side or server-side
  (Mustache) rendering.
